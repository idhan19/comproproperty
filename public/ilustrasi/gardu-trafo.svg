<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustrasi pemasangan trafo dan panel listrik untuk fasilitas industri">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a5e"/>
      <stop offset="1" stop-color="#171a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9cde0"/>
      <stop offset="0.5" stop-color="#f5f6f8"/>
      <stop offset="1" stop-color="#c9cde0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- siluet pabrik -->
  <g fill="#262a45">
    <rect x="430" y="150" width="34" height="140"/>
    <rect x="490" y="120" width="28" height="170"/>
    <path d="M400 290 V220 L470 190 V220 L540 190 V220 L610 190 V220 L680 190 V290 Z"/>
    <rect x="680" y="230" width="120" height="60"/>
  </g>
  <g fill="#ffffff" opacity="0.1">
    <circle cx="447" cy="130" r="16"/><circle cx="462" cy="108" r="12"/>
    <circle cx="504" cy="100" r="14"/><circle cx="520" cy="80" r="10"/>
  </g>

  <!-- tiang dan platform trafo -->
  <g fill="#f5f6f8">
    <rect x="132" y="110" width="12" height="300" rx="3"/>
    <rect x="296" y="110" width="12" height="300" rx="3"/>
    <rect x="118" y="262" width="204" height="10" rx="3"/>
    <rect x="118" y="126" width="204" height="7" rx="3"/>
  </g>
  <g fill="#fe0000">
    <circle cx="160" cy="126" r="6"/><circle cx="220" cy="126" r="6"/><circle cx="280" cy="126" r="6"/>
  </g>
  <g stroke="#e6e8f1" stroke-width="2.5" fill="none" opacity="0.85">
    <path d="M160 132 V188 M220 132 V182 M280 132 V188"/>
    <path d="M-10 118 Q70 140 160 126 M280 126 Q350 112 420 140"/>
  </g>

  <!-- trafo -->
  <rect x="166" y="186" width="108" height="76" rx="10" fill="url(#metal)"/>
  <g fill="#343a5e" opacity="0.35">
    <rect x="178" y="198" width="6" height="52" rx="3"/><rect x="192" y="198" width="6" height="52" rx="3"/>
    <rect x="242" y="198" width="6" height="52" rx="3"/><rect x="256" y="198" width="6" height="52" rx="3"/>
  </g>
  <circle cx="220" cy="224" r="16" fill="#fe0000"/>
  <path d="M222 212 l-9 14 h8 l-4 12 l12 -16 h-8 l4 -10 z" fill="#ffffff"/>

  <!-- panel distribusi -->
  <g transform="translate(330 300)">
    <rect width="120" height="110" rx="8" fill="#e6e8f1"/>
    <line x1="60" y1="10" x2="60" y2="100" stroke="#343a5e" stroke-width="2" opacity="0.4"/>
    <rect x="14" y="16" width="36" height="22" rx="3" fill="#343a5e"/>
    <rect x="70" y="16" width="36" height="22" rx="3" fill="#343a5e"/>
    <circle cx="44" cy="62" r="4" fill="#343a5e"/><circle cx="76" cy="62" r="4" fill="#343a5e"/>
    <path d="M60 72 L76 98 H44 Z" fill="#fddf6b"/>
    <path d="M61 79 l-5 8 h5 l-3 7 l8 -10 h-5 l3 -5 z" fill="#262a45"/>
  </g>
  <path d="M308 300 Q320 280 330 330" stroke="#e6e8f1" stroke-width="3" fill="none"/>

  <rect y="408" width="800" height="92" fill="#1d2036"/>
  <rect y="408" width="800" height="3" fill="#fe0000" opacity="0.7"/>
</svg>
