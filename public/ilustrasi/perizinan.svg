<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustrasi pengurusan perizinan perumahan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a5e"/>
      <stop offset="1" stop-color="#171a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <!-- pola cetak biru -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 62 H800 M0 124 H800 M0 186 H800 M0 248 H800 M0 310 H800 M0 372 H800 M0 434 H800"/>
    <path d="M62 0 V500 M124 0 V500 M186 0 V500 M248 0 V500 M558 0 V500 M620 0 V500 M682 0 V500 M744 0 V500"/>
  </g>

  <!-- dokumen di belakang -->
  <rect x="318" y="88" width="210" height="280" rx="10" fill="#c9cde0" transform="rotate(6 423 228)"/>
  <!-- dokumen utama -->
  <g transform="rotate(-4 400 250)">
    <rect x="280" y="96" width="230" height="300" rx="12" fill="#f5f6f8"/>
    <rect x="304" y="122" width="120" height="12" rx="6" fill="#262a45"/>
    <rect x="304" y="144" width="80" height="8" rx="4" fill="#c9cde0"/>
    <!-- denah rumah kecil -->
    <g transform="translate(395 205)" fill="none" stroke="#343a5e" stroke-width="4" stroke-linejoin="round">
      <path d="M-46 0 L0 -36 L46 0"/>
      <path d="M-36 -6 V40 H36 V-6"/>
      <rect x="-10" y="12" width="20" height="28" fill="#343a5e" stroke="none"/>
    </g>
    <g fill="#c9cde0">
      <rect x="304" y="270" width="182" height="8" rx="4"/>
      <rect x="304" y="290" width="160" height="8" rx="4"/>
      <rect x="304" y="310" width="172" height="8" rx="4"/>
      <rect x="304" y="330" width="120" height="8" rx="4"/>
    </g>
  </g>

  <!-- stempel disetujui -->
  <g transform="translate(520 330) rotate(-12)">
    <circle r="52" fill="none" stroke="#fe0000" stroke-width="6"/>
    <circle r="40" fill="#fe0000" opacity="0.12"/>
    <path d="M-20 0 L-6 15 L22 -14" stroke="#fe0000" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- pena -->
  <g transform="translate(220 360) rotate(-35)">
    <rect x="-8" y="-90" width="16" height="110" rx="4" fill="#e6e8f1"/>
    <rect x="-8" y="-90" width="16" height="22" rx="4" fill="#fe0000"/>
    <path d="M-8 20 L0 40 L8 20 Z" fill="#c9cde0"/>
  </g>
</svg>
