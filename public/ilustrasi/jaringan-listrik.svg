      <rect x="9" y="46" width="86" height="52" fill="url(#house)"/>
      <rect x="22" y="62" width="20" height="16" rx="2" fill="#343a5e"/>
      <rect x="60" y="62" width="20" height="36" rx="2" fill="#262a45"/>
