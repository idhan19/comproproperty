<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Ilustrasi pembangunan rumah di kawasan perumahan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343a5e"/>
      <stop offset="1" stop-color="#171a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f6f8"/>
      <stop offset="1" stop-color="#d9dcea"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <circle cx="640" cy="100" r="30" fill="#ffffff" opacity="0.12"/>

  <!-- bukit latar -->
  <path d="M0 340 Q200 290 400 330 T800 320 V500 H0 Z" fill="#262a45"/>

  <!-- deretan rumah jadi -->
  <g>
    <g transform="translate(70 270)">
      <path d="M0 50 L60 0 L120 50 Z" fill="#c9cde0"/>
      <rect x="10" y="50" width="100" height="88" fill="url(#wall)"/>
      <rect x="24" y="72" width="26" height="22" rx="2" fill="#fddf6b" opacity="0.85"/>
      <rect x="66" y="72" width="28" height="66" rx="2" fill="#262a45"/>
    </g>
    <g transform="translate(210 270)">
      <path d="M0 50 L60 0 L120 50 Z" fill="#c9cde0"/>
      <rect x="10" y="50" width="100" height="88" fill="url(#wall)"/>
      <rect x="24" y="72" width="26" height="22" rx="2" fill="#343a5e"/>
      <rect x="66" y="72" width="28" height="66" rx="2" fill="#262a45"/>
    </g>
  </g>

  <!-- rumah sedang dibangun: rangka atap + dinding bata sebagian -->
  <g transform="translate(370 250)">
    <g stroke="#f5f6f8" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M0 70 L80 0 L160 70"/>
      <path d="M40 35 L40 70 M80 0 L80 70 M120 35 L120 70"/>
      <path d="M40 35 L80 70 L120 35"/>
    </g>
    <!-- dinding bata penuh, siap dipasang atap -->
    <rect x="10" y="70" width="140" height="88" fill="#e6e8f1" opacity="0.92"/>
    <g stroke="#262a45" stroke-width="2" opacity="0.45">
      <path d="M10 92 H150 M10 114 H150 M10 136 H150"/>
      <path d="M45 70 V92 M95 70 V92 M130 70 V92 M25 92 V114 M70 92 V114 M115 92 V114 M45 114 V136 M95 114 V136 M130 114 V136 M25 136 V158 M115 136 V158"/>
    </g>
    <rect x="58" y="104" width="30" height="54" fill="#262a45"/>
  </g>

  <!-- tiang perancah -->
  <g stroke="#fddf6b" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M555 230 V408 M600 230 V408 M555 280 H600 M555 340 H600"/>
  </g>

  <!-- pohon -->
  <g fill="#e6e8f1" opacity="0.55">
    <circle cx="700" cy="300" r="40"/>
    <circle cx="670" cy="330" r="28"/>
    <rect x="696" y="330" width="8" height="78"/>
  </g>
  <!-- gerobak dorong -->
  <g transform="translate(610 380)">
    <path d="M0 0 H48 L40 18 H8 Z" fill="#fe0000"/>
    <circle cx="24" cy="24" r="5" fill="#e6e8f1"/>
    <path d="M48 0 L66 -10" stroke="#e6e8f1" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect y="408" width="800" height="92" fill="#1d2036"/>
  <rect y="408" width="800" height="3" fill="#fe0000" opacity="0.7"/>
</svg>
